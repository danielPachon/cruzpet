name: Backend

on:
  pull_request:
    paths:
      - "services/**"
      - "platform/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "platform/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar, probar y verificar
        run: ./gradlew build

      - name: Publicar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-de-pruebas
          path: "**/build/reports/tests/"

  publicar-imagenes:
    name: Publicar imágenes
    needs: construir-y-probar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [catalogos]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        run: |
          ./gradlew :services:${{ matrix.servicio }}:bootBuildImage -PimageTag=${GITHUB_SHA::7}
          docker push ghcr.io/danielpachon/cruzpet-${{ matrix.servicio }}:${GITHUB_SHA::7}
