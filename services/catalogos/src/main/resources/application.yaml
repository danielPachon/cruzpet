server:
  port: ${PORT:8101}

spring:
  application:
    name: catalogos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cruzpet_catalogos}
    username: ${DB_USUARIO:cruzpet}
    password: ${DB_CLAVE:cruzpet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/cruzpet}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
